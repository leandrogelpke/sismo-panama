name: Vigía de alertas (cada 10 min)

# Un job largo (~5 h 45 min) que revisa USGS y tsunami.gov cada 10 minutos y, al terminar,
# se vuelve a lanzar a sí mismo. Los crons de cada 6 h son solo red de seguridad.
on:
  schedule:
    - cron: "23 */6 * * *"
    - cron: "53 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sismo-vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar fpdf2 (PDF del informe)
        run: pip install -q fpdf2

      - name: Evitar dos vigías a la vez
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/runs?status=in_progress&per_page=10" --jq '.workflow_runs | length')
          echo "vigías en curso: $n"
          if [ "${n:-1}" -gt 1 ]; then echo "ya hay otro vigía corriendo — salgo"; echo "SKIP=1" >> "$GITHUB_ENV"; fi

      - name: Bucle de vigilancia (34 × 10 min)
        if: env.SKIP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAINSHOCK_ID: ${{ vars.MAINSHOCK_ID }}
          SEND_EVERY_HOURS: ${{ vars.SEND_EVERY_HOURS || '3' }}
          ALERT_MIN_MAG: ${{ vars.ALERT_MIN_MAG || '5.5' }}
          NEAR_MIN_MAG: ${{ vars.NEAR_MIN_MAG || '4.8' }}
          NEAR_KM: ${{ vars.NEAR_KM || '120' }}
        run: |
          for i in $(seq 1 34); do
            echo "=== pasada $i $(date -u '+%H:%M') UTC ==="
            python3 watch.py || true
            if [ "$i" -lt 34 ]; then sleep 600; fi
          done
          echo "bucle terminado"

      - name: Relanzarse para la siguiente ventana
        if: ${{ !cancelled() && env.SKIP != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" -f ref=main \
            && echo "relanzado" || echo "no se pudo relanzar (el cron de 6 h lo retomará)"
